<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sofa Builder / בונה הספה</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: #eee;
      gap: 10px;
      padding: 10px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    h1 {
      font-size: 1.9rem;
      color: #FFD93D;
      letter-spacing: 2px;
    }

    .btn {
      padding: 0.45rem 1.2rem;
      background: #4ECDC4;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }
    .btn:hover { background: #3ab5ac; transform: scale(1.05); }

    #canvas-wrap {
      position: relative;
      width: min(700px, 95vw, calc(92vh * 700 / 570));
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      cursor: crosshair;
    }

    /* Level select overlay — sits on top of the canvas */
    #level-select {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255,255,255,0.97);
      border-radius: 22px;
      padding: 26px 28px 22px;
      display: none;
      text-align: center;
      z-index: 10;
      width: 88%;
      max-width: 440px;
      box-shadow: 0 6px 30px rgba(0,0,0,0.3);
    }

    #ls-title {
      color: #333;
      font-size: 1.35rem;
      font-weight: bold;
      margin-bottom: 16px;
    }

    .level-grid {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .level-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #ddd;
      background: #fff;
      font-size: 1.5rem;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s, background 0.15s, border-color 0.15s;
      color: #333;
      line-height: 1;
    }
    .level-btn:not(.locked):hover {
      transform: scale(1.1);
      background: #f0faff;
      border-color: #4ECDC4;
    }
    .level-btn.locked {
      opacity: 0.38;
      cursor: not-allowed;
      filter: grayscale(1);
    }
    .level-btn .lv-stars {
      font-size: 0.6rem;
      letter-spacing: 1px;
      margin-top: 3px;
      color: #e8a800;
    }
  </style>
</head>
<body>

<div class="top-bar">
  <h1 id="title-text">Sofa Builder</h1>
  <button class="btn" id="lang-btn">עברית</button>
</div>

<div id="canvas-wrap">
  <canvas id="game" width="700" height="570"></canvas>
  <div id="level-select">
    <div id="ls-title">Choose a Level</div>
    <div class="level-grid" id="level-grid"></div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
//  CANVAS
// ════════════════════════════════════════════════════════
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');

// ════════════════════════════════════════════════════════
//  LAYOUT CONSTANTS
// ════════════════════════════════════════════════════════
const CW = 700, CH = 570;
const PLAY_X = 0, PLAY_Y = 52, PLAY_W = 484, PLAY_H = 418;
const GROUND_Y = 470;
const TRAY_X = 494, TRAY_Y = 52, TRAY_W = 206;
const BOTTOM_Y = 478;
const MOVE_STEP = 10;

// ════════════════════════════════════════════════════════
//  LANGUAGE
// ════════════════════════════════════════════════════════
let lang = 'en';
const STR = {
  en: {
    title:      'Sofa Builder',
    choose:     'Choose a Level',
    levelLabel: 'Level',
    levelNames: ['Reach the Cloud!','Fill the Square!','Build the Sofa!','Crazy Tower!','Fill the Triangle!'],
    hints: [
      '← → Move   |   Space / Click to Drop',
      '← → Move   |   Space / Click to Drop',
      'Snap pieces into the grey slots!',
      'Build the tallest tower!',
      '← → Move   |   Space / Click to Drop',
    ],
    complete:  'Level Complete!',
    nextLvl:   'Next Level →',
    menu:      'Menu',
    pieceTray: 'PIECES',
    stars: ['☆☆☆','★☆☆','★★☆','★★★'],
    locked: '🔒',
  },
  he: {
    title:      'בונה הספה',
    choose:     'בחר שלב',
    levelLabel: 'שלב',
    levelNames: ['הגע לעננים!','מלא את הריבוע!','בנה את הספה!','מגדל משוגע!','מלא את המשולש!'],
    hints: [
      '← → הזזה   |   רווח / לחיצה להנחה',
      '← → הזזה   |   רווח / לחיצה להנחה',
      'הכנס חלקים לחריצים האפורים!',
      'בנה את המגדל הגבוה ביותר!',
      '← → הזזה   |   רווח / לחיצה להנחה',
    ],
    complete:  '!כל הכבוד',
    nextLvl:   '← שלב הבא',
    menu:      'תפריט',
    pieceTray: 'חלקים',
    stars: ['☆☆☆','★☆☆','★★☆','★★★'],
    locked: '🔒',
  },
};
function s(k) { return STR[lang][k]; }

// ════════════════════════════════════════════════════════
//  PER-LEVEL COLOR THEMES  (sofa cover styles)
// ════════════════════════════════════════════════════════
const THEMES = [
  { bg:'#FFF9F0', ground:'#8B6914', pieces:['#FF6B6B','#FFD93D','#6BCB77','#FF9FF3','#4ECDC4','#A29BFE'] },
  { bg:'#F0FFF6', ground:'#3a6b47', pieces:['#45B7D1','#96CEB4','#FFEAA7','#DDA0DD','#98FB98','#87CEEB'] },
  { bg:'#FFF0F5', ground:'#7a3a52', pieces:['#FF8C94','#FFAAA5','#FFD3B6','#DCEDC1','#A8E6CF','#88D8B0'] },
  { bg:'#F0F4FF', ground:'#2f4a72', pieces:['#667EEA','#764BA2','#F093FB','#F5576C','#4FACFE','#43E97B'] },
  { bg:'#FFFBF0', ground:'#6e5500', pieces:['#FFC200','#FF6B35','#F7B731','#20BF6B','#0652DD','#9980FA'] },
];

// ════════════════════════════════════════════════════════
//  PIECE DEFINITIONS
// ════════════════════════════════════════════════════════
const PDEFS = {
  squareCushion: { w:80,  h:80,  shape:'rect'   },
  hRectCushion:  { w:140, h:70,  shape:'rect'   },
  tallCushion:   { w:60,  h:110, shape:'rect'   },
  smallPillow:   { w:60,  h:60,  shape:'circle' },
  backrest:      { w:200, h:90,  shape:'rect'   },
  armrest:       { w:50,  h:80,  shape:'rect'   },
};
const PKEYS = Object.keys(PDEFS);

function pieceColor(defId, lvlIdx) {
  const t = THEMES[lvlIdx !== undefined ? lvlIdx : curLevel];
  return t.pieces[PKEYS.indexOf(defId) % t.pieces.length];
}

// ════════════════════════════════════════════════════════
//  LEVEL DEFINITIONS
// ════════════════════════════════════════════════════════
const LEVELS = [
  {
    type: 'height',
    targetY: GROUND_Y - 240,
    pieces: ['squareCushion','squareCushion','hRectCushion','squareCushion'],
    thresh: [60, 150, 230],
  },
  {
    type: 'shapefill',
    shape: 'square',
    rect: { x:80, y:GROUND_Y-220, w:220, h:220 },
    pieces: ['hRectCushion','hRectCushion','squareCushion','squareCushion','hRectCushion'],
    thresh: [0.35, 0.6, 0.82],
  },
  {
    type: 'sofasnap',
    slots: [
      { id:'seat',  rect:{x:90,  y:GROUND_Y-88,  w:200, h:80 }, accepts:['hRectCushion','squareCushion'] },
      { id:'back',  rect:{x:90,  y:GROUND_Y-178, w:200, h:86 }, accepts:['backrest']    },
      { id:'lArm',  rect:{x:40,  y:GROUND_Y-148, w:50,  h:128}, accepts:['armrest']     },
      { id:'rArm',  rect:{x:290, y:GROUND_Y-148, w:50,  h:128}, accepts:['armrest']     },
      { id:'pillo', rect:{x:168, y:GROUND_Y-248, w:60,  h:60 }, accepts:['smallPillow'] },
    ],
    pieces: ['hRectCushion','backrest','armrest','armrest','smallPillow'],
    thresh: [1, 3, 5],
  },
  {
    type: 'crazyTower',
    pieces: ['squareCushion','tallCushion','hRectCushion','squareCushion','smallPillow','tallCushion','armrest'],
    thresh: [80, 180, 300],
  },
  {
    type: 'shapefill',
    shape: 'triangle',
    pts: [[70,GROUND_Y],[390,GROUND_Y],[230,GROUND_Y-250]],
    pieces: ['squareCushion','squareCushion','hRectCushion','tallCushion','smallPillow','squareCushion'],
    thresh: [0.25, 0.5, 0.72],
  },
];

// ════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════
let phase   = 'levelSelect'; // 'levelSelect' | 'playing' | 'celebrating'
let curLevel = 0;
let stars   = [0,0,0,0,0];
let placed  = [];          // [{defId,x,y}]
let active  = null;        // {defId,x,y}
let tray    = [];          // defId[]
let trayIdx = 0;
let snapped = {};          // {slotId: defId}  (sofasnap)
let confetti = [];
let celStars = 0;
let celStart = 0;
let rDown   = 0;
let raf     = null;

// ════════════════════════════════════════════════════════
//  AUDIO
// ════════════════════════════════════════════════════════
let ac = null;
function audio() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  return ac;
}
function beep(freq, dur, type='sine', vol=0.28) {
  try {
    const a = audio();
    const o = a.createOscillator(), g = a.createGain();
    o.connect(g); g.connect(a.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.start(); o.stop(a.currentTime + dur);
  } catch(_) {}
}
function sndDrop()      { beep(280, 0.14, 'sine', 0.22); }
function sndSnap()      { beep(523, 0.12); beep(784, 0.18); }
function sndClick()     { beep(440, 0.07, 'square', 0.14); }
function sndCelebrate() { [523,659,784,1047].forEach((f,i) => setTimeout(()=>beep(f,0.28),i*110)); }
function sndBad()       { beep(220, 0.18, 'sawtooth', 0.15); }

// ════════════════════════════════════════════════════════
//  DRAWING UTILITIES
// ════════════════════════════════════════════════════════
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  if (ctx.roundRect) { ctx.roundRect(x,y,w,h,r); return; }
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w,y, x+w,y+h, r);
  ctx.arcTo(x+w,y+h, x,y+h, r);
  ctx.arcTo(x,y+h, x,y, r);
  ctx.arcTo(x,y, x+w,y, r);
  ctx.closePath();
}

function darken(hex, amt) {
  let r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return '#'+[r,g,b].map(v=>Math.max(0,Math.round(v*(1-amt))).toString(16).padStart(2,'0')).join('');
}

function drawPieceAt(defId, x, y, alpha, lvlIdx) {
  const d = PDEFS[defId];
  const col = pieceColor(defId, lvlIdx);
  const dark = darken(col, 0.28);
  ctx.save();
  ctx.globalAlpha = alpha ?? 1;
  if (d.shape === 'circle') {
    const cx = x+d.w/2, cy = y+d.h/2, r = d.w/2;
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(cx+3,cy+3,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.38)';
    ctx.beginPath(); ctx.arc(cx-r*0.28,cy-r*0.28,r*0.42,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); roundRect(x+4,y+4,d.w,d.h,12); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); roundRect(x,y,d.w,d.h,12); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.32)';
    ctx.beginPath(); roundRect(x+7,y+7,d.w-14,d.h*0.34,8); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 2;
    ctx.beginPath(); roundRect(x,y,d.w,d.h,12); ctx.stroke();
    // decorative dots
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(x+d.w*0.3,y+d.h*0.62,3.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(x+d.w*0.7,y+d.h*0.62,3.5,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawPieceMini(defId, cx, cy, size, alpha, lvlIdx) {
  const d = PDEFS[defId];
  const scale = size / Math.max(d.w, d.h);
  const dw = d.w*scale, dh = d.h*scale;
  drawPieceAt(defId, cx-dw/2, cy-dh/2, alpha, lvlIdx);
  // re-draw at scaled size by using a temp transform
  // Actually: draw mini by direct shapes
  const col = pieceColor(defId, lvlIdx);
  const dark = darken(col, 0.28);
  ctx.save();
  ctx.globalAlpha = alpha ?? 1;
  if (d.shape === 'circle') {
    const r = size/2;
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.arc(cx+2,cy+2,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.stroke();
  } else {
    ctx.fillStyle = dark;
    ctx.beginPath(); roundRect(cx-dw/2+3,cy-dh/2+3,dw,dh,6); ctx.fill();
    ctx.fillStyle = col;
    ctx.beginPath(); roundRect(cx-dw/2,cy-dh/2,dw,dh,6); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 1.5;
    ctx.beginPath(); roundRect(cx-dw/2,cy-dh/2,dw,dh,6); ctx.stroke();
  }
  ctx.restore();
}

function drawStar(cx, cy, r, filled, color) {
  color = color || '#FFD93D';
  ctx.save();
  ctx.fillStyle = filled ? color : 'transparent';
  ctx.strokeStyle = color; ctx.lineWidth = 1.8;
  ctx.beginPath();
  for (let i=0; i<5; i++) {
    const a  = i*4*Math.PI/5 - Math.PI/2;
    const ai = (i*4+2)*Math.PI/5 - Math.PI/2;
    i===0 ? ctx.moveTo(cx+r*Math.cos(a), cy+r*Math.sin(a))
          : ctx.lineTo(cx+r*Math.cos(a), cy+r*Math.sin(a));
    ctx.lineTo(cx+r*0.4*Math.cos(ai), cy+r*0.4*Math.sin(ai));
  }
  ctx.closePath();
  if (filled) ctx.fill();
  ctx.stroke();
  ctx.restore();
}

// ════════════════════════════════════════════════════════
//  DRAW SECTIONS
// ════════════════════════════════════════════════════════
function drawBackground() {
  const th = THEMES[curLevel];
  // play zone
  ctx.fillStyle = th.bg;
  ctx.fillRect(PLAY_X, PLAY_Y, PLAY_W, PLAY_H);
  // polka dots
  ctx.fillStyle = 'rgba(0,0,0,0.04)';
  for (let px=20; px<PLAY_W; px+=40) {
    for (let py=PLAY_Y+20; py<GROUND_Y; py+=40) {
      ctx.beginPath(); ctx.arc(px,py,3.5,0,Math.PI*2); ctx.fill();
    }
  }
  // tray
  ctx.fillStyle = '#f3f3f3';
  ctx.fillRect(TRAY_X, PLAY_Y, TRAY_W, PLAY_H);
  ctx.strokeStyle = '#ddd'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(TRAY_X,PLAY_Y); ctx.lineTo(TRAY_X,GROUND_Y); ctx.stroke();
  // ground
  const grd = ctx.createLinearGradient(0,GROUND_Y,0,CH-46);
  grd.addColorStop(0, th.ground);
  grd.addColorStop(1, darken(th.ground, 0.35));
  ctx.fillStyle = grd;
  ctx.fillRect(0, GROUND_Y, CW, CH-46-GROUND_Y+GROUND_Y);
  // bottom bar
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, BOTTOM_Y, CW, CH-BOTTOM_Y);
}

function drawHeader() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, CW, PLAY_Y);
  const name = s('levelNames')[curLevel];
  ctx.fillStyle = '#FFD93D';
  ctx.font = 'bold 16px Segoe UI';
  ctx.textAlign = 'left';
  ctx.fillText(`${s('levelLabel')} ${curLevel+1}: ${name}`, 10, 33);
  // stars
  for (let i=0;i<3;i++) drawStar(390+i*28, 26, 11, i<stars[curLevel]);
  // hint text
  ctx.fillStyle = '#a8dadc';
  ctx.font = '13px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText(s('hints')[curLevel], CW/2, CH-8);
  // menu button
  ctx.fillStyle = '#e94560';
  ctx.beginPath(); roundRect(CW-86, CH-44, 76, 26, 7); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Segoe UI';
  ctx.textAlign = 'center';
  ctx.fillText(s('menu'), CW-48, CH-26);
}

function drawCloud(cx, cy) {
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.shadowColor='rgba(100,160,255,0.4)'; ctx.shadowBlur=8;
  [[0,0,20],[18,-8,15],[-18,-8,15],[34,0,12],[-34,0,12]].forEach(([dx,dy,r])=>{
    ctx.beginPath(); ctx.arc(cx+dx,cy+dy,r,0,Math.PI*2); ctx.fill();
  });
  ctx.restore();
}

function drawChallengeGuide() {
  const lv = LEVELS[curLevel];

  if (lv.type === 'height' || lv.type === 'crazyTower') {
    const tY = lv.type === 'height' ? lv.targetY : GROUND_Y-300;
    ctx.save();
    ctx.setLineDash([9,6]);
    ctx.strokeStyle = '#4A90D9'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(12,tY); ctx.lineTo(PLAY_W-12,tY); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
    drawCloud(PLAY_W/2, tY-24);

    if (lv.type === 'crazyTower') {
      // thermometer
      const mH=200, mX=10, mY=GROUND_Y-mH-8;
      ctx.strokeStyle='#ccc'; ctx.lineWidth=2; ctx.strokeRect(mX,mY,16,mH);
      const fH = Math.min(mH, getTowerH()/330*mH);
      ctx.fillStyle='#FF6B6B';
      ctx.fillRect(mX+1, mY+mH-fH, 14, fH);
      ctx.fillStyle='#555'; ctx.font='10px Segoe UI'; ctx.textAlign='center';
      ctx.fillText(Math.round(getTowerH())+'px', mX+8, mY-4);
    }
  }

  if (lv.type === 'shapefill') {
    ctx.save();
    if (lv.shape === 'square') {
      const r = lv.rect;
      ctx.fillStyle='rgba(74,144,217,0.07)'; ctx.fillRect(r.x,r.y,r.w,r.h);
      ctx.setLineDash([8,5]); ctx.strokeStyle='#4A90D9'; ctx.lineWidth=2.2;
      ctx.strokeRect(r.x,r.y,r.w,r.h);
    } else {
      const [a,b,c] = lv.pts;
      ctx.fillStyle='rgba(74,144,217,0.07)';
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.closePath(); ctx.fill();
      ctx.setLineDash([8,5]); ctx.strokeStyle='#4A90D9'; ctx.lineWidth=2.2;
      ctx.beginPath(); ctx.moveTo(a[0],a[1]); ctx.lineTo(b[0],b[1]); ctx.lineTo(c[0],c[1]); ctx.closePath(); ctx.stroke();
    }
    ctx.restore();
  }

  if (lv.type === 'sofasnap') {
    for (const slot of lv.slots) {
      if (snapped[slot.id]) continue;
      const r = slot.rect;
      const highlight = active && slot.accepts.includes(active.defId);
      ctx.save();
      ctx.fillStyle = highlight ? 'rgba(78,205,196,0.2)' : 'rgba(180,180,180,0.22)';
      ctx.strokeStyle = highlight ? '#4ECDC4' : '#bbb';
      ctx.lineWidth = 2; ctx.setLineDash([6,4]);
      ctx.beginPath(); roundRect(r.x,r.y,r.w,r.h,10); ctx.fill(); ctx.stroke();
      ctx.setLineDash([]); ctx.restore();
    }
  }
}

function drawPlaced() {
  for (const p of placed) drawPieceAt(p.defId, p.x, p.y, 1);
}

function drawGhost() {
  if (!active) return;
  const landY = getLandY(active);
  const d = PDEFS[active.defId];
  drawPieceAt(active.defId, active.x, landY, 0.28);
  ctx.save();
  ctx.setLineDash([4,4]); ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(active.x+d.w/2, active.y+d.h);
  ctx.lineTo(active.x+d.w/2, landY);
  ctx.stroke(); ctx.setLineDash([]); ctx.restore();
}

function drawActive() {
  if (!active) return;
  ctx.save();
  ctx.shadowColor='rgba(255,255,255,0.9)'; ctx.shadowBlur=16;
  drawPieceAt(active.defId, active.x, active.y, 1);
  ctx.restore();
}

function drawTray() {
  ctx.fillStyle='#888'; ctx.font='bold 11px Segoe UI'; ctx.textAlign='center';
  ctx.fillText(s('pieceTray'), TRAY_X+TRAY_W/2, PLAY_Y+15);

  if (tray.length === 0) return;
  const maxSlotH = (GROUND_Y - PLAY_Y - 24) / tray.length;
  const slotH = Math.min(88, maxSlotH);

  tray.forEach((defId, i) => {
    const cy = PLAY_Y + 22 + i*slotH + slotH/2;
    const cx = TRAY_X + TRAY_W/2;
    if (i === trayIdx) {
      ctx.fillStyle='rgba(255,230,0,0.25)';
      ctx.beginPath(); roundRect(TRAY_X+4, PLAY_Y+20+i*slotH, TRAY_W-8, slotH, 8); ctx.fill();
    }
    const size = Math.min(54, slotH-10, TRAY_W-24);
    drawPieceMini(defId, cx, cy, size, i===trayIdx ? 1 : 0.6);
  });
}

// ════════════════════════════════════════════════════════
//  CELEBRATION
// ════════════════════════════════════════════════════════
function spawnConfetti() {
  const cols=['#FF6B6B','#FFD93D','#6BCB77','#4ECDC4','#A29BFE','#FF9FF3','#fff'];
  confetti = Array.from({length:44}, ()=>({
    x: Math.random()*PLAY_W,
    y: PLAY_Y + Math.random()*60,
    vx: (Math.random()-0.5)*4.5,
    vy: Math.random()*2.5+1,
    col: cols[Math.floor(Math.random()*cols.length)],
    a: Math.random()*Math.PI*2,
    spin: (Math.random()-0.5)*0.22,
    w: Math.random()*9+5,
    h: Math.random()*5+3,
  }));
}

function stepConfetti() {
  confetti.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.14; p.a+=p.spin; });
  confetti = confetti.filter(p=>p.y<CH+10);
}

function drawCelebration() {
  const el = performance.now() - celStart;
  stepConfetti();
  confetti.forEach(p=>{
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a);
    ctx.fillStyle=p.col; ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx.restore();
  });

  // dim overlay
  ctx.fillStyle='rgba(10,10,30,0.62)';
  ctx.fillRect(0, PLAY_Y, PLAY_W, GROUND_Y-PLAY_Y);

  // "Level Complete!" text
  const bounce = Math.sin(el/180)*6;
  ctx.fillStyle='#FFD93D'; ctx.font='bold 38px Segoe UI'; ctx.textAlign='center';
  ctx.fillText(s('complete'), PLAY_W/2, PLAY_Y+114+bounce);

  // stars pop-in
  for (let i=0;i<3;i++) {
    const t = el-(450+i*200);
    if (t < 0) continue;
    const sc = t < 200 ? Math.min(1.3, t/120) : 1 + Math.sin(t/120)*0.06;
    ctx.save();
    ctx.translate(PLAY_W/2-58+i*58, PLAY_Y+178);
    ctx.scale(sc,sc);
    drawStar(0,0,22, i<celStars);
    ctx.restore();
  }

  // "Next Level" button (appears after 1.5s)
  if (el > 1500) {
    const bx=PLAY_W/2-82, by=PLAY_Y+226, bw=164, bh=48;
    ctx.fillStyle='#6BCB77';
    ctx.beginPath(); roundRect(bx,by,bw,bh,13); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold 17px Segoe UI'; ctx.textAlign='center';
    ctx.fillText(s('nextLvl'), PLAY_W/2, by+30);
  }
}

// ════════════════════════════════════════════════════════
//  GAME LOGIC
// ════════════════════════════════════════════════════════
function getLandY(piece) {
  const d = PDEFS[piece.defId];
  let y = GROUND_Y - d.h;
  for (const p of placed) {
    const pd = PDEFS[p.defId];
    if (piece.x < p.x+pd.w && piece.x+d.w > p.x) {
      y = Math.min(y, p.y-d.h);
    }
  }
  return Math.max(PLAY_Y, y);
}

function getTowerH() {
  if (!placed.length) return 0;
  return GROUND_Y - Math.min(...placed.map(p=>p.y));
}

function spawnActive() {
  if (!tray.length) { active=null; return; }
  const defId = tray[trayIdx];
  const d = PDEFS[defId];
  active = {
    defId,
    x: Math.round((PLAY_W/2-d.w/2)/MOVE_STEP)*MOVE_STEP,
    y: PLAY_Y+6,
  };
}

function clampActiveX() {
  if (!active) return;
  const d = PDEFS[active.defId];
  active.x = Math.max(PLAY_X, Math.min(PLAY_W-d.w, active.x));
}

function drop() {
  if (!active || phase!=='playing') return;
  const d = PDEFS[active.defId];
  const lv = LEVELS[curLevel];
  let didSnap = false;

  if (lv.type === 'sofasnap') {
    const pcx = active.x+d.w/2, pcy = active.y+d.h/2;
    let best=null, bestD=Infinity;
    for (const sl of lv.slots) {
      if (snapped[sl.id]) continue;
      if (!sl.accepts.includes(active.defId)) continue;
      const sx=sl.rect.x+sl.rect.w/2, sy=sl.rect.y+sl.rect.h/2;
      const dist=Math.hypot(pcx-sx,pcy-sy);
      if (dist<130 && dist<bestD) { best=sl; bestD=dist; }
    }
    if (best) {
      snapped[best.id]=active.defId;
      placed.push({defId:active.defId, x:best.rect.x, y:best.rect.y});
      sndSnap(); didSnap=true;
    }
  }

  if (!didSnap) {
    const landY=getLandY(active);
    placed.push({defId:active.defId, x:active.x, y:landY});
    sndDrop();
  }

  tray.splice(trayIdx,1);
  if (trayIdx>=tray.length) trayIdx=Math.max(0,tray.length-1);
  active=null;
  checkComplete();
  if (tray.length>0) spawnActive();
}

function computeStars() {
  const lv = LEVELS[curLevel];
  let val;
  if (lv.type==='height') {
    const top=placed.length ? Math.min(...placed.map(p=>p.y)) : GROUND_Y;
    val=GROUND_Y-top;
  } else if (lv.type==='crazyTower') {
    val=getTowerH();
  } else if (lv.type==='shapefill') {
    val=fillRatio();
  } else if (lv.type==='sofasnap') {
    val=Object.keys(snapped).length;
  }
  if (val>=lv.thresh[2]) return 3;
  if (val>=lv.thresh[1]) return 2;
  if (val>=lv.thresh[0]) return 1;
  return 0;
}

function fillRatio() {
  const lv=LEVELS[curLevel];
  const G=4; let total=0, filled=0;
  if (lv.shape==='square') {
    const r=lv.rect;
    for (let gx=r.x; gx<r.x+r.w; gx+=G) for (let gy=r.y; gy<r.y+r.h; gy+=G) {
      total++;
      for (const p of placed) {
        const pd=PDEFS[p.defId];
        if (gx>=p.x && gx<p.x+pd.w && gy>=p.y && gy<p.y+pd.h) { filled++; break; }
      }
    }
  } else {
    const [a,b,c]=lv.pts;
    const minX=Math.min(a[0],b[0],c[0]), maxX=Math.max(a[0],b[0],c[0]);
    const minY=Math.min(a[1],b[1],c[1]), maxY=Math.max(a[1],b[1],c[1]);
    for (let gx=minX; gx<maxX; gx+=G) for (let gy=minY; gy<maxY; gy+=G) {
      if (!inTri(gx,gy,a,b,c)) continue;
      total++;
      for (const p of placed) {
        const pd=PDEFS[p.defId];
        if (gx>=p.x && gx<p.x+pd.w && gy>=p.y && gy<p.y+pd.h) { filled++; break; }
      }
    }
  }
  return total>0 ? filled/total : 0;
}

function inTri(px,py,a,b,c) {
  const sg=(ax,ay,bx,by)=>(px-bx)*(ay-by)-(ax-bx)*(py-by);
  const d1=sg(a[0],a[1],b[0],b[1]), d2=sg(b[0],b[1],c[0],c[1]), d3=sg(c[0],c[1],a[0],a[1]);
  return !((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));
}

function checkComplete() {
  if (tray.length>0) return;
  const st=Math.max(1,computeStars());
  stars[curLevel]=Math.max(stars[curLevel],st);
  setTimeout(()=>celebrate(st),300);
}

function celebrate(st) {
  phase='celebrating';
  celStars=st; celStart=performance.now();
  spawnConfetti(); sndCelebrate();
}

// ════════════════════════════════════════════════════════
//  LEVEL SELECT
// ════════════════════════════════════════════════════════
function showLevelSelect() {
  phase='levelSelect';
  const ls=document.getElementById('level-select');
  const grid=document.getElementById('level-grid');
  document.getElementById('ls-title').textContent=s('choose');
  grid.innerHTML='';
  LEVELS.forEach((_,i)=>{
    const locked = i>0 && stars[i-1]===0;
    const btn=document.createElement('button');
    btn.className='level-btn'+(locked?' locked':'');
    const st=stars[i];
    btn.innerHTML=`<span>${i+1}</span><span class="lv-stars">${'★'.repeat(st)}${'☆'.repeat(3-st)}</span>`;
    if (!locked) btn.addEventListener('click',()=>{ sndClick(); startLevel(i); });
    grid.appendChild(btn);
  });
  ls.style.display='block';
}

function hideLevelSelect() {
  document.getElementById('level-select').style.display='none';
}

function startLevel(i) {
  curLevel=i; phase='playing';
  const lv=LEVELS[i];
  tray=[...lv.pieces]; trayIdx=0;
  placed=[]; snapped={}; confetti=[];
  active=null; hideLevelSelect();
  spawnActive();
}

function restartLevel() { startLevel(curLevel); }

// ════════════════════════════════════════════════════════
//  GAME LOOP
// ════════════════════════════════════════════════════════
function loop() {
  ctx.clearRect(0,0,CW,CH);

  if (phase==='levelSelect') {
    ctx.fillStyle='#1a1a2e';
    ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle='#FFD93D'; ctx.font='bold 30px Segoe UI'; ctx.textAlign='center';
    ctx.fillText(s('title'), CW/2, CH/2);
  } else {
    drawBackground();
    drawHeader();
    drawChallengeGuide();
    drawPlaced();
    if (phase==='playing') { drawGhost(); drawActive(); }
    drawTray();
    if (phase==='celebrating') drawCelebration();
  }

  raf=requestAnimationFrame(loop);
}

// ════════════════════════════════════════════════════════
//  INPUT — KEYBOARD
// ════════════════════════════════════════════════════════
document.addEventListener('keydown', e=>{
  if (phase==='celebrating') {
    if ((e.key==='Enter'||e.key===' ') && performance.now()-celStart>1500) {
      e.preventDefault();
      if (curLevel<LEVELS.length-1) startLevel(curLevel+1); else showLevelSelect();
    }
    return;
  }
  if (phase!=='playing') return;

  if (e.key==='ArrowLeft' && active) {
    e.preventDefault();
    active.x=Math.max(PLAY_X, active.x-MOVE_STEP);
  }
  if (e.key==='ArrowRight' && active) {
    e.preventDefault();
    const d=PDEFS[active.defId];
    active.x=Math.min(PLAY_W-d.w, active.x+MOVE_STEP);
  }
  if (e.key==='ArrowUp') {
    e.preventDefault();
    if (tray.length) { trayIdx=(trayIdx-1+tray.length)%tray.length; spawnActive(); }
  }
  if (e.key==='ArrowDown') {
    e.preventDefault();
    if (tray.length) { trayIdx=(trayIdx+1)%tray.length; spawnActive(); }
  }
  if (e.key===' ') { e.preventDefault(); drop(); }
  if (e.key==='Escape') showLevelSelect();
  if ((e.key==='r'||e.key==='R') && !rDown) rDown=Date.now();
});

document.addEventListener('keyup', e=>{
  if ((e.key==='r'||e.key==='R') && rDown) {
    if (Date.now()-rDown>480) restartLevel();
    rDown=0;
  }
});

// ════════════════════════════════════════════════════════
//  INPUT — MOUSE
// ════════════════════════════════════════════════════════
function canvasCoords(e) {
  const r=canvas.getBoundingClientRect();
  return {
    x: (e.clientX-r.left)*(CW/r.width),
    y: (e.clientY-r.top)*(CH/r.height),
  };
}

canvas.addEventListener('mousemove', e=>{
  if (phase!=='playing' || !active) return;
  const {x}=canvasCoords(e);
  const d=PDEFS[active.defId];
  active.x=Math.max(PLAY_X, Math.min(PLAY_W-d.w, x-d.w/2));
});

canvas.addEventListener('click', e=>{
  const {x,y}=canvasCoords(e);

  if (phase==='playing') {
    // menu button
    if (x>CW-86 && y>CH-44 && x<CW-10 && y<CH-18) {
      sndClick(); showLevelSelect(); return;
    }
    // click in play zone → drop
    if (x<PLAY_W && y>=PLAY_Y && y<GROUND_Y) {
      // move piece to click X then drop
      if (active) {
        const d=PDEFS[active.defId];
        active.x=Math.max(PLAY_X,Math.min(PLAY_W-d.w,x-d.w/2));
      }
      drop(); return;
    }
    // click tray piece
    if (x>=TRAY_X && tray.length>0) {
      const slotH=Math.min(88,(GROUND_Y-PLAY_Y-24)/tray.length);
      const i=Math.floor((y-PLAY_Y-20)/slotH);
      if (i>=0 && i<tray.length) { trayIdx=i; spawnActive(); sndClick(); }
    }
    return;
  }

  if (phase==='celebrating') {
    const el=performance.now()-celStart;
    const bx=PLAY_W/2-82, by=PLAY_Y+226, bw=164, bh=48;
    if (el>1500 && x>bx && x<bx+bw && y>by && y<by+bh) {
      sndClick();
      if (curLevel<LEVELS.length-1) startLevel(curLevel+1); else showLevelSelect();
    }
  }
});

// ════════════════════════════════════════════════════════
//  LANGUAGE TOGGLE
// ════════════════════════════════════════════════════════
document.getElementById('lang-btn').addEventListener('click',()=>{
  lang = lang==='en' ? 'he' : 'en';
  document.getElementById('lang-btn').textContent = lang==='en' ? 'עברית' : 'English';
  document.getElementById('title-text').textContent = s('title');
  if (phase==='levelSelect') showLevelSelect();
  sndClick();
});

// ════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════
function init() {
  stars=[0,0,0,0,0];
  showLevelSelect();
  if (raf) cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

init();
</script>
